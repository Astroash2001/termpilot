<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- TermPilot: an orienteering control flag on map paper. The paper half holds the prompt,
       the overprint-purple half the cursor, and the flag pops off the paper on a hard ink shadow.
       Full bleed, motif inside the maskable safe circle (radius 205 around the centre). -->
  <rect width="512" height="512" fill="#fbfaf5"/>
  <g fill="none" stroke="#7a4b2a" stroke-opacity="0.16" stroke-width="4">
    <ellipse cx="420" cy="70" rx="170" ry="120"/>
    <ellipse cx="420" cy="70" rx="250" ry="185"/>
    <ellipse cx="420" cy="70" rx="330" ry="250"/>
    <ellipse cx="60" cy="470" rx="150" ry="110"/>
    <ellipse cx="60" cy="470" rx="230" ry="170"/>
  </g>
  <rect x="136" y="136" width="256" height="256" fill="#1d1a16"/>
  <path d="M116 116h256v256H116z" fill="#fbfaf5"/>
  <path d="M372 116v256H116z" fill="#c4007a"/>
  <path d="M116 116h256v256H116z" fill="none" stroke="#1d1a16" stroke-width="14" stroke-linejoin="miter"/>
  <path d="M158 168l50 42-50 42" fill="none" stroke="#1d1a16" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="282" y="312" width="58" height="22" fill="#fbfaf5"/>
</svg>
